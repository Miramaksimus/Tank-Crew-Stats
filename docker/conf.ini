[http]
host = 0.0.0.0
port = 8077

[database]
host = db
port = 5432
name = il2_stats
user = il2_stats
password = il2_stats

[game_server]
; Mount your IL-2 dedicated server directory here (read-write) so the parser
; can find <path>/data/<text_log_folder> and back up processed logs.
; Only used by the "parser" service.
path = /il2server

[stats]
mission_report_delete = false
mission_report_backup_days = 31
inactive_player_days = 7
new_tour_by_month = true
win_by_score = true
win_score_min = 2000
win_score_ratio = 1.25
sortie_min_time = 0
skin_id = 1

; Mods (Django apps) enabled
mods = mod_rating_by_type,mod_stats_by_aircraft

; Stats Enhancements modules
modules = split_rankings, ammo_breakdown, ironman_stats, last_mission_ironman, ironman_squad, flight_time_bonus, adjustable_bonuses_penalties, top_last_mission, rearm_accuracy_workaround, bailout_accuracy_workaround, gunner_stats, rams

; Disconnect mod
sortie_disco_min_time = 0
sortie_damage_disco_time = 120

; Global Aircraft Stats / Split Rankings retroactive computation
retro_compute_for_last_tours = 10

; Ironman style
ironman_style = both

[email]
send_email = false
from_email = noreply@example.com
email_host = smtp.mailgun.org
email_host_user = postmaster@mailgun.example.com
email_host_password = 123456
email_port = 25
email_use_tls = false
email_use_ssl = false
